name: Publish Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  platform-natives:
    uses: ./.github/workflows/platform-natives.yml

  minimum-zstd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-env
        with:
          zstd-version-file: .github/zstd-minimum-version

      - name: Test against minimum supported zstd
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/zstd/lib
        run: ./gradlew test -PexpectedZstdVersion=10506

  publish:
    needs: [platform-natives, minimum-zstd]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Job wide so every Gradle invocation uses the same release version.
      - name: Validate and set release version
        shell: bash
        run: |
          version=${GITHUB_REF_NAME#v}
          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*))?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if [[ ! "$version" =~ $semver ]]; then
            echo "Release tag '$GITHUB_REF_NAME' is not a valid SemVer version" >&2
            exit 1
          fi
          echo "ORG_GRADLE_PROJECT_version=$version" >> "$GITHUB_ENV"

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-env

      - name: Assemble bundled platform resources
        uses: actions/download-artifact@v8
        with:
          pattern: zstd-*
          path: platforms/src/main/resources
          merge-multiple: true

      - name: Validate bundled platform resources
        run: ./gradlew :platforms:verifyPlatformResources

      - name: Build with Gradle
        run: ./gradlew build

      - name: Javadoc with Gradle
        run: ./gradlew javadoc

      - name: Test with Gradle
        run: ./gradlew test

      - name: Validate jextract bindings
        run: |
          ./gradlew --no-configuration-cache :bindings:generateZstdBindings
          git diff --exit-code bindings/src/autogenerated/java
          test -z "$(git status --porcelain bindings/src/autogenerated/java)"

      - name: Native tests with Gradle
        run: ./gradlew nativeTest -PtestBundledNatives=true

      - name: Publish to Maven Central
        run: ./gradlew publish
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.CENTRAL_SIGNINGKEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.CENTRAL_SIGNINGKEY_PASSWORD }}
