name: Build

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  platform-natives:
    uses: ./.github/workflows/platform-natives.yml

  build:
    needs: platform-natives
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-env

      - name: Assemble bundled platform resources
        uses: actions/download-artifact@v8
        with:
          pattern: zstd-*
          path: platforms/src/main/resources
          merge-multiple: true

      - name: Validate bundled platform resources
        run: ./gradlew :platforms:verifyPlatformResources

      - name: Build with Gradle
        run: ./gradlew build

      - name: Javadoc with Gradle
        run: ./gradlew javadoc

      - name: Test with Gradle
        run: ./gradlew test

      - name: Validate jextract bindings
        run: |
          ./gradlew --no-configuration-cache :bindings:generateZstdBindings
          git diff --exit-code bindings/src/autogenerated/java
          test -z "$(git status --porcelain bindings/src/autogenerated/java)"

      - name: Native tests with Gradle
        run: ./gradlew nativeTest
